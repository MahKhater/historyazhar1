<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك أسئلة التاريخ - سر التفوق | للثانوية الأزهرية</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* حماية ضد النسخ */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        header {
            text-align: center;
            border-bottom: 3px solid #2e7d32;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: #2e7d32;
            margin: 0 0 5px 0;
            font-size: 26px;
        }
        .brand {
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .question-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1b5e20;
        }
        .options label {
            display: block;
            background: #fff;
            border: 1px solid #ccc;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .options label:hover {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        .options input {
            margin-left: 10px;
        }
        .btn-submit {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #1b5e20;
        }
        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .correct-answer {
            color: #2e7d32;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
        }
        .wrong-answer {
            color: #c62828;
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>بنك أسئلة مادة التاريخ</h1>
        <div class="brand">منصة سر التفوق - للثانوية الأزهرية (د. محمود خاطر)</div>
    </header>

    <form id="quizForm">
        <!-- السؤال الأول -->
        <div class="question-card">
            <div class="question-title">1. الحملة الفرنسية على مصر والشام: ما هي معركة الحصار البحري التي أثرت بشكل مباشر على إمدادات الفرنسيين؟</div>
            <div class="options">
                <label><input type="radio" name="q1" value="a"> أ) معركة أبو قير البحرية</label>
                <label><input type="radio" name="q1" value="b"> ب) معركة الأهرام</label>
                <label><input type="radio" name="q1" value="c"> ج) معركة شبراخيت</label>
                <label><input type="radio" name="q1" value="d"> د) معركة إمبابة</label>
            </div>
        </div>

        <!-- السؤال الثاني -->
        <div class="question-card">
            <div class="question-title">2. تولى محمد علي باشا حكم مصر عام 1805 بناءً على رغبة مين؟</div>
            <div class="options">
                <label><input type="radio" name="q2" value="a"> أ) السلطان العثماني منفردًا</label>
                <label><input type="radio" name="q2" value="b"> ب) زعماء الشعب المصري والعلماء دار المحكمة</label>
                <label><input type="radio" name="q2" value="c"> ج) المماليك</label>
                <label><input type="radio" name="q2" value="d"> د) الدول الأوروبية الكبرى</label>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="calculateScore()">إظهار النتيجة</button>
    </form>

    <div id="result"></div>
</div>

<script>
    function calculateScore() {
        const answers = {
            q1: 'a',
            q2: 'b'
        };

        let score = 0;
        let total = Object.keys(answers).length;
        let allAnswered = true;

        for (let key in answers) {
            const userSelection = document.querySelector(`input[name="${key}"]:checked`);
            if (!userSelection) {
                allAnswered = false;
                break;
            }
            if (userSelection.value === answers[key]) {
                score++;
            }
        }

        const resultDiv = document.getElementById('result');
        if (!allAnswered) {
            resultDiv.style.display = 'block';
            resultDiv.className = 'wrong-answer';
            resultDiv.innerHTML = '⚠️ برجاء الإجابة على جميع الأسئلة قبل إرسال النموذج!';
            return;
        }

        resultDiv.style.display = 'block';
        if (score === total) {
            resultDiv.className = 'correct-answer';
            resultDiv.innerHTML = `🎉 بطل! لقد حصلت على ${score} من ${total}. استمر في سر التفوق!`;
        } else {
            resultDiv.className = 'wrong-answer';
            resultDiv.innerHTML = `💡 لقد حصلت على ${score} من ${total}. راجع المنهج وحاول مرة أخرى!`;
        }
    }
</script>

</body>
</html>
